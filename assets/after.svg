<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1020"/><stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="160" r="320" fill="#7c5cff" opacity="0.12"/>
  <circle cx="260" cy="780" r="260" fill="#22d3ee" opacity="0.10"/>
  <!-- nav -->
  <text x="80" y="92" fill="#fff" font-size="30" font-weight="700">Studio<tspan fill="#22d3ee">.</tspan></text>
  <g fill="#9aa6b8" font-size="20">
    <text x="1120" y="90">Услуги</text><text x="1240" y="90">Работы</text><text x="1360" y="90">Контакты</text>
  </g>
  <rect x="1460" y="64" width="64" height="38" rx="19" fill="url(#acc)"/>
  <!-- hero -->
  <text x="80" y="330" fill="#eef2f7" font-size="78" font-weight="800">Современный</text>
  <text x="80" y="420" font-size="78" font-weight="800" fill="url(#acc)">дизайн сайта.</text>
  <text x="80" y="480" fill="#9aa6b8" font-size="26">Быстро, адаптивно и под ваш бренд.</text>
  <rect x="80" y="520" width="240" height="64" rx="32" fill="url(#acc)"/>
  <text x="200" y="561" fill="#04110f" font-size="24" font-weight="700" text-anchor="middle">Заказать</text>
  <rect x="340" y="520" width="200" height="64" rx="32" fill="none" stroke="#3a4258" stroke-width="2"/>
  <text x="440" y="561" fill="#eef2f7" font-size="24" text-anchor="middle">Работы</text>
  <!-- floating card -->
  <rect x="980" y="300" width="520" height="320" rx="24" fill="#1a2236" stroke="#2b344c" stroke-width="2"/>
  <rect x="1020" y="340" width="80" height="80" rx="20" fill="url(#acc)" opacity="0.9"/>
  <rect x="1020" y="450" width="320" height="20" rx="10" fill="#2f3a54"/>
  <rect x="1020" y="490" width="440" height="20" rx="10" fill="#2f3a54"/>
  <rect x="1020" y="530" width="260" height="20" rx="10" fill="#2f3a54"/>
  <rect x="1020" y="572" width="160" height="14" rx="7" fill="#22d3ee" opacity="0.7"/>
</svg>
